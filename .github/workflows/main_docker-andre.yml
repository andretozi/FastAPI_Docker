name: Build Docker image and deploy to Azure Web App - DOCKER-ANDRE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (fastapi-lab10)
        run: |
          docker build \
            -t fastapi-lab10:${{ github.run_number }} \
            -t fastapi-lab10:latest \
            .
          echo "==== Imagens Docker criadas ===="
          docker images | grep fastapi-lab10

      - name: Teste rapido da imagem Docker
        run: |
          docker run -d -p 8000:8000 --name test-container fastapi-lab10:latest
          sleep 8
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/ || (docker logs test-container && exit 1)
          echo "==== Imagem Docker validada com sucesso ===="
          docker stop test-container
          docker rm test-container

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Criar virtualenv e instalar dependencias
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload do artefato para o job de deploy
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download do artefato do job de build
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C863744DA477464CB41B5E1DDB7A854D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C1574BE3BE694CEFB63A3E490D8F5CAC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E2DC25A8A234B4C9A1E2D72C8112B97 }}

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'DOCKER-ANDRE'
          slot-name: 'Production'
